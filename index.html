<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sneha 💖</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      overflow: hidden;
    }

    .floating {
      animation: float 6s infinite ease-in-out;
    }

    .twinkle {
      animation: twinkle 2s infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .fade-in {
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-500 via-purple-600 to-fuchsia-500 relative overflow-y-auto py-10"></body>

  <!-- Stars -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute top-10 left-20 text-white text-2xl twinkle">✨</div>
    <div class="absolute top-32 right-24 text-white text-xl twinkle">⭐</div>
    <div class="absolute bottom-40 left-32 text-white text-2xl twinkle">✨</div>
    <div class="absolute bottom-20 right-40 text-white text-xl twinkle">⭐</div>
    <div class="absolute top-1/2 left-10 text-white text-xl twinkle">✨</div>
  </div>

  <!-- Floating hearts -->
  <div class="absolute top-20 left-16 text-4xl floating">💖</div>
  <div class="absolute top-32 right-20 text-3xl floating">💜</div>
  <div class="absolute bottom-24 left-24 text-3xl floating">💕</div>
  <div class="absolute bottom-32 right-16 text-4xl floating">🎀</div>

  <!-- Main Card -->
  <div id="mainCard" class="fade-in z-10 text-center backdrop-blur-xl bg-white/20 border border-white/30 shadow-2xl rounded-3xl p-10 max-w-2xl mx-4">

    <h1 class="text-5xl md:text-7xl font-bold text-white mb-6">
      Hey Sneha 💜
    </h1>

    <h2 class="text-xl md:text-3xl text-white mb-4">
      Someone made something super special for you ✨
    </h2>

    <p class="text-white/90 text-lg md:text-xl mb-8">
      Click below to begin your magical birthday surprise 🎁
    </p>

    <button
      onclick="enterSurprise()"
      class="bg-white text-pink-600 px-8 py-4 rounded-full text-xl font-semibold shadow-xl hover:scale-110 transition duration-300 animate-pulse"
    >
      Enter Sneha's Birthday World 💖
    </button>

  </div>

  <!-- Music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="./music/song.mp3" type="audio/mpeg">
  </audio>

  <script>
    function enterSurprise() {
      const music = document.getElementById("bgMusic");
      const card = document.getElementById("mainCard");

      music.play();

      card.innerHTML = `
        <div class="text-center text-white">
          <h1 class="text-5xl md:text-6xl font-bold mb-6 animate-pulse">
            A Special Gift For Sneha 🎂💖
          </h1>

          <p class="text-xl mb-8">
            Click the gift to open your surprise 🎁✨
          </p>

          <div onclick="openGift()" class="cursor-pointer text-9xl hover:scale-110 transition duration-500 animate-bounce">
            🎁
          </div>
        </div>
      `;
    }

    function openGift() {
      const card = document.getElementById("mainCard");

      card.innerHTML = `
        <div class="text-center text-white">
          <h1 class="text-6xl font-bold mb-6 animate-pulse">
            Surpriseeee Sneha 💖✨
          </h1>

          <div class="text-9xl animate-bounce">💝</div>

          <p class="text-2xl mt-8">
            Your beautiful memories are waiting 📸💜
          </p>

          <button onclick="showMemories()"
            class="mt-8 bg-white text-pink-600 px-8 py-4 rounded-full text-xl font-semibold hover:scale-110 transition">
            Open Memories 💕
          </button>
        </div>
      `;
    }

    function showMemories() {
      const card = document.getElementById("mainCard");

      card.innerHTML = `
        <div class="text-center text-white">
          <h1 class="text-5xl font-bold mb-8">
            Our Beautiful Memories 📸💖
          </h1>

          <div class="grid grid-cols-2 gap-4">
<img src="./images/photo1.jpeg" class="rounded-2xl shadow-lg h-64 w-full object-contain bg-white/10">
<img src="./images/photo2.jpeg" class="rounded-2xl shadow-lg h-64 w-full object-contain bg-white/10">
<img src="./images/photo3.jpeg" class="rounded-2xl shadow-lg h-64 w-full object-contain bg-white/10">
<img src="./images/photo4.jpeg" class="rounded-2xl shadow-lg h-64 w-full object-contain bg-white/10">


<button onclick="showVideos()"
  class="mt-8 bg-white text-pink-600 px-8 py-4 rounded-full text-xl font-semibold hover:scale-110 transition">
  Watch Our Videos 🎥
</button>
        </div>
      `;

    }

    function showVideos() {
  const card = document.getElementById("mainCard");

  card.innerHTML = `
    <div class="text-center text-white w-full">
      <h1 class="text-5xl font-bold mb-8">
        Our Video Memories 🎥💜
      </h1>

      <div class="space-y-6">
        <video controls class="rounded-2xl shadow-lg w-full">
          <source src="./videos/video1.mp4" type="video/mp4">
        </video>

        <video controls class="rounded-2xl shadow-lg w-full">
          <source src="./videos/video2.mp4" type="video/mp4">
        </video>
      </div>

      <button onclick="finalWish()"
        class="mt-8 bg-white text-pink-600 px-8 py-4 rounded-full text-xl font-semibold hover:scale-110 transition">
        Final Surprise 💌
      </button>
    </div>
  `;
}

function finalWish() {
  const card = document.getElementById("mainCard");

  confetti({
    particleCount: 250,
    spread: 140,
    origin: { y: 0.6 }
  });

  card.innerHTML = `
    <div class="text-center text-white">
      <h1 class="text-6xl font-bold mb-8 animate-pulse">
        Happy Birthday Sneha 🎂💖
      </h1>

      <p id="birthdayMessage" class="text-2xl leading-relaxed max-w-3xl mx-auto"></p>

      <div class="text-7xl mt-8 animate-bounce">
        🎉🎂💜✨💖
      </div>
    </div>
  `;

  const message = "Thank you for being my bestestttt friend forever 🥹💜 Every memory with you is magical ✨ I’m so lucky to have you 💕 Love you endlessly bestie 💖 Happy Birthday Snehaaaa 🎂";

  let i = 0;

  function typeWriter() {
    if (i < message.length) {
      document.getElementById("birthdayMessage").innerHTML += message.charAt(i);
      i++;
      setTimeout(typeWriter, 45);
    }
  }

  typeWriter();
}
  </script>

</body>
</html>
